<!doctype html>

<title>數學科獎勵計劃</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#4a2f10;
 background:#f6e7c8;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 6px,transparent 7px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.5) 0 5px,transparent 6px),linear-gradient(160deg,#fdf0cf,#f3dda6 60%,#eecf8e);
 background-size:220px 220px,180px 180px,100% 100%;min-height:100vh;padding:18px;-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto}
.card{background:#fdf7e6;border:8px solid #c98b2e;border-radius:26px;box-shadow:0 12px 0 #a36c1c,0 20px 40px rgba(0,0,0,.25);padding:20px 22px}
.logo{text-align:center;margin:4px 0 16px}
.logo b{font-size:clamp(28px,7vw,48px);letter-spacing:3px;color:#ffd54a;-webkit-text-stroke:7px #8a4a12;paint-order:stroke fill;text-shadow:0 6px 0 #8a4a12,0 9px 14px rgba(0,0,0,.3);display:inline-block}
.logo span{display:block;font-size:13px;color:#b07a24;font-weight:700;letter-spacing:5px;margin-top:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:linear-gradient(#fff6d8,#ffe29a);border:4px solid #b87b22;border-radius:999px;padding:8px 20px;font-weight:800;font-size:18px;box-shadow:0 4px 0 #a3691a,inset 0 2px 0 #fff}
.pill em{font-style:normal;color:#e2571c;font-size:26px}
.nick{font-size:13px;background:#8a4a12;color:#ffe9b0;border-radius:999px;padding:7px 16px;font-weight:700}
table{width:100%;border-collapse:separate;border-spacing:0;border:4px solid #b87b22;border-radius:16px;overflow:hidden;background:#fffdf5;font-size:14px}
thead th{background:linear-gradient(#ffd766,#efb02f);color:#5a3407;font-size:14px;padding:10px 8px;border-right:3px solid #c98b2e;white-space:nowrap}
thead th:last-child{border-right:0}
td{padding:9px 8px;border-top:3px solid #ecd7a5;border-right:3px solid #f0e3c6;text-align:center;background:#fffdf5}
td:last-child{border-right:0}
tr:nth-child(even) td{background:#fffaee}
.ico{font-size:26px;line-height:1}
.item{font-weight:800;color:#5a3407;text-align:left;padding-left:12px}
.item small{display:block;font-weight:600;color:#a3803f;font-size:11px}
.cost{font-weight:900;color:#e2571c;font-size:17px}
.stock{color:#3a8a3a;font-weight:800}
.limit{color:#d0296a;font-weight:800;font-size:12px}
.btn{background:linear-gradient(#ffb03a,#f07d18);color:#fff;border:3px solid #fff;border-radius:999px;padding:9px 20px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #b85a0d,0 8px 12px rgba(0,0,0,.18);text-shadow:0 2px 0 rgba(0,0,0,.25);font-family:inherit;transition:.12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b85a0d}
.btn.dis{background:linear-gradient(#cfcabc,#b0a999);box-shadow:0 5px 0 #8e8778;cursor:not-allowed}
.btn2{background:linear-gradient(#d76bd0,#a83fae);box-shadow:0 5px 0 #7d2b82,0 8px 12px rgba(0,0,0,.18)}
.btn3{background:linear-gradient(#68c76a,#2f8f3f);box-shadow:0 5px 0 #1f6a2c,0 8px 12px rgba(0,0,0,.18)}
.btnS{padding:5px 12px;font-size:12px;box-shadow:0 3px 0 #b85a0d}
.foot{display:flex;justify-content:space-between;margin-top:14px;gap:10px;flex-wrap:wrap}
.center{text-align:center;padding:26px 10px}
.center h2{font-size:22px;color:#8a4a12;margin-bottom:10px}
.center p{color:#a3803f;font-weight:700;margin-bottom:16px;line-height:1.7}
.inp{font-family:inherit;font-size:17px;padding:10px 14px;border:3px solid #c98b2e;border-radius:12px;background:#fffdf5;text-align:center;width:130px}
.inp.sm{font-size:14px;padding:7px 10px;width:auto;border-width:2px;text-align:left}
select.inp{width:auto;text-align:left}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:3px solid #c98b2e;border-radius:999px;padding:12px 24px;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit;color:#4a2f10;box-shadow:0 5px 0 #a3691a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:3px solid #c98b2e;background:#fffdf5;border-radius:999px;padding:8px 18px;font-weight:800;font-size:14px;cursor:pointer;color:#8a4a12;font-family:inherit}
.tab.on{background:linear-gradient(#ffd766,#efb02f);color:#5a3407}
.req{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:3px dashed #e0b060;background:#fffdf6;border-radius:14px;margin-bottom:10px;flex-wrap:wrap}
.req .who{font-weight:900;font-size:15px}
.req .what{font-size:12px;color:#a3803f}
.req .gift{font-weight:800;color:#a3601a}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:#fffdf5;border:3px solid #e8cf9a;border-left:8px solid #c98b2e;border-radius:14px;padding:10px 14px}
.stat b{display:block;font-size:22px;color:#5a3407}
.stat span{font-size:12px;color:#a3803f;font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140px);background:#2f8f3f;color:#fff;padding:13px 26px;border-radius:999px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:.28s;opacity:0;z-index:99;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#c0392b}
.hint{font-size:12px;color:#a3803f;margin-top:10px;line-height:1.7}
.hide{display:none !important}
.tblwrap{overflow-x:auto}
.sechd{font-size:16px;font-weight:900;color:#8a4a12;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.badge{background:#e2571c;color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #e0c89a;border-top-color:#c98b2e;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.langbar{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.langbar button{padding:6px 16px;font-size:13px}
.gimg{object-fit:cover;border-radius:10px;border:2px solid #e0c89a;vertical-align:middle;display:inline-block}
.ipv{width:64px;height:64px;border:3px solid #c98b2e;border-radius:12px;background:#fffdf5;display:flex;align-items:center;justify-content:center;font-size:10px;color:#a3803f;overflow:hidden;text-align:center}
.ipv img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:100;overflow:auto}
.mbox{background:#fdf7e6;border:6px solid #c98b2e;border-radius:20px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.mbox h3{color:#8a4a12;font-size:18px;margin-bottom:12px;text-align:center}
.fld{margin-bottom:10px;text-align:left}
.fld label{display:block;font-size:12px;font-weight:800;color:#8a4a12;margin-bottom:4px}
.fld input,.fld select{width:100%;font-family:inherit;font-size:15px;padding:8px 10px;border:3px solid #c98b2e;border-radius:10px;background:#fffdf5;text-align:left}
.fld input[type=range]{padding:0;border:0;background:transparent}
.row2{display:flex;gap:10px}
.row2 .fld{flex:1}
.cropbox{width:200px;height:200px;margin:8px auto;border:4px solid #c98b2e;border-radius:16px;overflow:hidden;background:#fff;touch-action:none;cursor:move;position:relative}
.cropbox canvas{display:block;width:200px;height:200px}
/* ===== 手機版（≤620px）===== */
@media (max-width:620px){
  body{padding:10px}
  .card{padding:15px 13px;border-width:6px;border-radius:20px;box-shadow:0 8px 0 #a36c1c,0 12px 24px rgba(0,0,0,.2)}
  .logo b{font-size:clamp(24px,9vw,34px);letter-spacing:1px;-webkit-text-stroke-width:5px}
  .logo span{letter-spacing:2px;font-size:11px}
  .bar{gap:8px}
  .pill{font-size:16px;padding:7px 14px}
  .nick{font-size:12px;padding:6px 12px}
  .stat{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat b{font-size:19px}
  .stat span{font-size:11px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto;font-size:13px;padding:8px 14px}
  .btn{padding:11px 18px;font-size:15px}
  .btnS{padding:9px 15px;font-size:13px}
  .foot{flex-direction:column}
  .foot .btn{width:100%}
  .inp{width:100%}
  .inp.sm{width:100%;flex:1;min-width:0}
  .center h2{font-size:19px}
  .req{flex-direction:column;align-items:flex-start;gap:6px}
  /* 表格 → 卡片（純 block 排版；flex 會令 td 文字隱形）*/
  .tblwrap{overflow:visible}
  .rt{border:0!important;background:transparent!important;overflow:visible;font-size:15px}
  .rt thead{display:none}
  .rt tbody,.rt tr,.rt td{display:block;width:auto}
  .rt tr{border:3px solid #e8cf9a;border-radius:16px;background:#fffdf5;margin-bottom:10px;padding:10px 12px;box-shadow:0 3px 0 #eadfc0}
  .rt td{border:0!important;background:transparent!important;padding:3px 0;text-align:left;font-size:15px}
  .rt td[data-label]::before{content:attr(data-label) "：";color:#a3803f;font-weight:800;font-size:12.5px}
  .rt tr:nth-child(even) td{background:transparent!important}
  .rt td.lead{font-size:17px;font-weight:900;color:#5a3407;padding-bottom:6px;line-height:1.3}
  .rt td.lead small{display:block;font-weight:600;color:#a3803f;font-size:12px}
  .rt td.ico{padding-bottom:2px;line-height:1}
  .rt td.ico .ico{font-size:34px}
  .rt td.ico .gimg{width:56px!important;height:56px!important;display:block}
  .rt td.cost{font-size:19px;font-weight:900;color:#c0392b}
  .rt td.act{padding-top:10px}
  .rt td.act .btn{width:100%}
  .rt td.full{padding-top:4px;color:#7a5a20}
  .rt+.sechd,.sechd{margin-top:16px}
  .onlypc{display:none!important}
  #askOv .btn{font-size:15px;padding:11px 14px}
  /* 禮物卡／紀錄卡收窄（圖示浮左，文字繞住） */
  .rt tr{padding:9px 11px;margin-bottom:8px}
  .rt td{padding:1.5px 0}
  .rt td.ico{float:left;margin:0 9px 0 0;padding:0}
  .rt td.ico .ico{font-size:30px;line-height:1}
  .rt td.ico .gimg{width:46px!important;height:46px!important}
  .rt td.act{padding-top:8px;clear:both}
  .rt td.act .btn{padding:10px 14px}
  /* 管理台學生列表：手機用「精簡表格」，一屏睇 12–15 人 */
  .ct{display:table!important;width:100%!important;border:3px solid #b87b22!important;border-radius:14px;overflow:hidden;background:#fffdf5!important;font-size:13px;border-spacing:0!important}
  .ct thead{display:table-header-group!important}
  .ct tbody{display:table-row-group!important}
  .ct tr{display:table-row!important;border:0!important;border-radius:0!important;margin:0!important;padding:0!important;box-shadow:none!important;background:transparent!important}
  .ct th{padding:5px 4px!important;font-size:11px!important}
  .ct td{display:table-cell!important;border-top:2px solid #ecd7a5!important;border-right:0!important;padding:5px 4px!important;text-align:center;vertical-align:middle;background:transparent!important;font-size:13px}
  .ct td[data-label]::before{content:none!important}
  .ct td.lead{text-align:left;font-size:14px;font-weight:900;color:#5a3407;padding:5px 6px!important}
  .ct td.lead div{display:none}
  .ct td.cost{font-size:15px!important;color:#c0392b;font-weight:900}
  .ct .hide-s{display:none!important}
  .ct td.act{padding:4px 6px!important}
  .ct td.act .btn{width:auto;padding:6px 9px;font-size:12px;box-shadow:0 2px 0 #a36c1c;border-radius:9px}
  .ct tr:nth-child(even) td{background:#fffaee!important}
}
</style>

    thIcon:'圖示', thItem:'兌換物品', thCost:'所需積分', thStock:'存貨', thLimit:'兌換限制', thRedeem:'兌換',
    unlim:'無限', gain1:'獲得 x1', notEnough:'積分不足', soldOut:'已換完',

function T(k, o){
  let s = (I18N[LANG] && I18N[LANG][k]) || (I18N.zh[k] || k);
  if (o) Object.keys(o).forEach(function(x){ s = s.split('{' + x + '}').join(o[x]); });
  return s;
}
/* 後端中文錯誤 → 英文（學生用） */
const ERR_EN = [
  [/^未登入/, 'Not signed in'],
  [/登入憑證無效/, 'Session expired, please sign in again'],
  [/^帳戶未綁定/, 'Your account is not linked yet'],
  [/^帳戶未經老師批准/, 'Your account is not approved yet'],

];
function terr(msg){
  const s = String(msg == null ? '' : msg);
  if (LANG !== 'en') return s;
  for (let i = 0; i < ERR_EN.length; i++) if (ERR_EN[i][0].test(s)) return s.replace(ERR_EN[i][0], ERR_EN[i][1]);
  return s;
}
function gloss(k){ return LANG === 'en' ? '' : k; }
function setLang(l){ LANG = l; try { localStorage.setItem('lang', l); } catch(e){} if (PREVIEW) { renderStudent(PREVIEW.reqs); } else { boot(); } }
function langSwitch(){
  return '<div class="langbar">'
    + '<button class="btn btnS ' + (LANG === 'zh' ? 'btn3' : '') + '" onclick="setLang(\'zh\')">中文</button>'
    + '<button class="btn btnS ' + (LANG === 'en' ? 'btn3' : '') + '" onclick="setLang(\'en\')">English</button></div>';
}
function iconHtml(g, size){
  const s = size || 42;
  if (g && g.img) return '<img class="gimg" style="width:' + s + 'px;height:' + s + 'px" src="' + g.img + '">';
  return '<span class="ico">' + esc((g && g.icon) || '🎁') + '</span>';
}
function gName(g){ return (LANG === 'en' && g.nameEn) ? g.nameEn : g.name; }
function gNote(g){ return (LANG === 'en' && g.noteEn) ? g.noteEn : (g.note || ''); }
function stateTxt(s){ return s === '已批准' ? T('stApproved') : (s === '已拒絕' ? T('stRejected') : (s === '待批核' ? T('stPending') : s)); }
function limitTxt(g){
  const t = g.limitType === '每月' ? T('perMonth') : (g.limitType === '活動' ? T('perEvent') : T('perWeek'));
  return T('limitFmt', { t: t, n: g.limitN });
}
/* 換領紀錄內的禮物名（存於後端為中文）→ 英文模式時對照現有禮物表 */
function histName(name){
  if (LANG !== 'en') return name;
  const hit = (GIFTS || []).filter(function(g){ return g.name === name; })[0];
  return (hit && hit.nameEn) ? hit.nameEn : name;
}

/* ================= 狀態 ================= */
let IDT = localStorage.getItem('sess') || sessionStorage.getItem('idtoken') || '';
let ME = null, GIFTS = [], ADMIN = null, TAB = 'students', PREVIEW = null, SEARCH = '';
function groupLabel(g){ return String(g || '').replace('_MATH_', ' ').replace(/_/g, ' '); }

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='toast', 2600);
}
async function api(action, payload){
  const body = Object.assign({ action, token: IDT }, payload || {});
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(terr(j.error || '發生錯誤'));
  return j.data;
}
/* 加到主畫面提示（只喺手機、未加入、未撳過「知道了」時顯示）*/
function installHint(){
  try {
    if (window.navigator.standalone) return '';
    if (localStorage.getItem('hidInst')) return '';
    if (!/iPhone|iPad|iPod|Android/.test(navigator.userAgent || '')) return '';
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent || '');
    const t = ios ? '📲 想一撳即開？撳下面「分享」→「加到主畫面」' : '📲 想一撳即開？撳右上「⋮」→「加到主畫面」';
    return '<div class="hint" style="background:#fff6d8;border:3px dashed #e0b060;border-radius:12px;padding:10px;margin-bottom:10px;text-align:center">'
      + t + ' <button class="btn btnS" style="margin-left:6px" onclick="localStorage.setItem(\'hidInst\',1);this.parentNode.style.display=\'none\'">知道了</button></div>';
  } catch (e) { return ''; }
}
function shell(inner, withLang){
  $('#app').innerHTML = '<div class="card"><div class="logo"><b>' + T('appTitle') + '</b><span>' + T('appSub') + '</span></div>'
    + (withLang ? langSwitch() : '') + inner + '</div>';
}

/* ================= 登入 ================= */
function renderLogin(){
  shell('<div class="center"><h2>' + T('login') + '</h2><p>' + T('loginHint') + '<br>' + T('loginMail') + '</p>'
    + '<div id="gbtn"></div>'
    + '<div class="hint">' + T('firstTime') + '</div>' + installHint() + '</div>', true);
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
  google.accounts.id.renderButton($('#gbtn'), { theme:'outline', size:'large', text:'signin_with', locale: LANG === 'en' ? 'en' : 'zh_TW', width:280 });
}
async function onCredential(res){
  IDT = res.credential;
  try {                                   /* 用 Google 憑證換取本系統長效 session */
    const r = await api('login');
    IDT = r.session;
    try { localStorage.setItem('sess', IDT); sessionStorage.removeItem('idtoken'); } catch (e) {}
  } catch (e) { try { sessionStorage.setItem('idtoken', res.credential); } catch (e2) {} }
  boot();
}

/* ================= 啟動 ================= */
async function boot(){
  try {
    if (!IDT || CLIENT_ID.indexOf('PASTE') === 0) { renderLogin(); return; }
    const h = await api('home');          /* 一次過攞齊（原本要 2–3 次來回）*/
    ME = h.me;
    if (IDT.indexOf('.') >= 0) {          /* 舊式 Google 憑證 → 靜靜升級成長效 session */
      try { const r = await api('login'); IDT = r.session; localStorage.setItem('sess', IDT); sessionStorage.removeItem('idtoken'); } catch (e) {}
    }
    if (ME.admin) {
      if (h.admin) { ADMIN = h.admin; GIFTS = ADMIN.gifts; } else { await loadAdmin(); }
      renderAdmin(); return;
    }
    if (ME.pending) { renderPending(); return; }
    if (!ME.bound) { renderBind(); return; }
    GIFTS = h.gifts || [];
    renderStudent(h.reqs || []);
  } catch (e) {
    if (String(e.message||'').indexOf('登入') >= 0) {
      try { sessionStorage.removeItem('idtoken'); localStorage.removeItem('sess'); } catch (x) {}
      IDT = '';
      try { toast('登入已失效，請重新登入（' + e.message + '）', true); } catch (x) {}
      renderLogin(); return;
    }
    shell('<div class="center"><h2>' + T('error') + '</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="boot()">' + T('retry') + '</button></div>', true);
  }
}

/* ================= 確認視窗 ================= */
function ask(html, onYes){
  try{
    const d = document.createElement('div');
    d.id = 'askOv';
    d.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(60,30,0,.55);z-index:9999;display:table;width:100%;height:100%');
    d.innerHTML = '<div style="display:table-cell;vertical-align:middle;padding:18px">'
      + '<div style="background:#fdf7e6;border:6px solid #c98b2e;border-radius:22px;padding:18px;max-width:420px;margin:0 auto;box-shadow:0 10px 0 #a36c1c">'
      + '<div style="font-size:17px;font-weight:900;color:#5a3407;margin-bottom:10px">' + T('confirmTitle') + '</div>'
      + '<div style="font-size:15px;color:#4a2f10;line-height:1.65;margin-bottom:16px">' + html + '</div>'
      + '<div style="text-align:center;white-space:nowrap">'
      + '<button class="btn btn3" id="askYes" style="min-width:44%">' + T('okBtn') + '</button>'
      + '<button class="btn btn2" id="askNo" style="min-width:44%;margin-left:8px">' + T('cancelBtn') + '</button>'
      + '</div></div></div>';
    document.body.appendChild(d);
    document.getElementById('askYes').onclick = function(){ document.body.removeChild(d); if (onYes) onYes(); };
    document.getElementById('askNo').onclick = function(){ document.body.removeChild(d); };
  } catch (e) {
    if (onYes && window.confirm(String(html).replace(/<[^>]*>/g, ''))) onYes();
  }
}

/* ================= 學生：綁定 ================= */
function renderBind(){
  const classes = ['2A','2B','2C','2D','3A','3B','3C','3D','4A','4B','4C','4D','5A','5B','5C','5D','6A','6B','6C','6D'];
  shell('<div class="center"><h2>' + T('bindTitle') + '</h2>'
    + '<p>' + T('bindDesc') + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center">'
    + '<select class="inp" id="cls">' + classes.map(c=>'<option>'+c+'</option>').join('') + '</select>'
    + '<input class="inp" id="no" type="number" min="1" max="45" placeholder="' + T('classNoPh') + '">'
    + '</div>'
    + '<div style="margin-top:18px"><button class="btn btn3" onclick="doBind()">' + T('sendApply') + '</button></div>'
    + '<div class="hint">' + T('yourEmail') + esc(ME.email) + '<br>' + T('bindNote') + '</div></div>', true);
}
async function doBind(){
  const cls = $('#cls').value, no = $('#no').value;
  if (!no) { toast(T('needClsNo'), true); return; }
  ask(T('confirmBind', { cls: esc(cls), no: esc(no) }), async function(){
    try { await api('bind', { cls, no }); toast(T('sentWait')); setTimeout(boot, 800); }
    catch (e) { toast(e.message, true); }
  });
}
function renderPending(){
  shell('<div class="center"><h2>' + T('pendingTitle') + '</h2><p>'
    + T('pendingDesc', { cls: esc(ME.cls), no: esc(ME.no), chi: esc(ME.chi||'') }) + '</p>'
    + '<button class="btn" onclick="boot()">' + T('refresh') + '</button></div>', true);
}

/* ================= 學生：兌換所 ================= */
function renderStudent(reqs){
  const s = ME.student, avail = ME.available;
  const isPrev = !!(ME && ME.preview);
  let rows = '';
  GIFTS.forEach(g=>{
    const can = avail >= g.cost && g.stock > 0 && !isPrev;
    const stockTxt = g.stock >= 999 ? T('unlim') : g.stock;
    const nm = gName(g), nt = gNote(g);
    rows += '<tr><td class="ico">' + iconHtml(g) + '</td>'
      + '<td class="item lead">' + esc(nm) + (nt ? '<small>' + esc(nt) + '</small>' : '<small>' + T('gain1') + '</small>') + '</td>'
      + '<td class="cost" data-label="' + T('thCost') + '">' + g.cost + '</td>'
      + '<td class="stock" data-label="' + T('thStock') + '">' + stockTxt + '</td>'
      + '<td class="limit" data-label="' + T('thLimit') + '">' + limitTxt(g) + '</td>'
      + '<td class="act">' + (can ? '<button class="btn" onclick="redeem(' + g.row + ',\'' + esc(nm) + '\')">' + T('thRedeem') + '</button>'
                     : '<button class="btn dis" disabled>' + (isPrev ? '👀 預覽' : (g.stock > 0 ? T('notEnough') : T('soldOut'))) + '</button>') + '</td></tr>';
  });
  let rh = '';
  (reqs||[]).forEach(r=>{
    const c = r.state === '已批准' ? '#2f8f3f' : (r.state === '已拒絕' ? '#c0392b' : '#d0296a');
    rh += '<tr><td class="lead">' + esc(histName(r.gift)) + '</td>'
        + '<td class="cost" data-label="' + T('thPoints') + '">' + r.cost + '</td>'
        + '<td data-label="' + T('thState') + '" style="color:' + c + ';font-weight:900">' + esc(stateTxt(r.state))
        + (r.state === '待批核' ? ' <button class="btn btnS" style="background:#c0392b;padding:5px 9px;font-size:12px" onclick="cancelAsk(\'' + esc(r.gift) + '\')">' + T('cancelReqBtn') + '</button>' : '') + '</td>'
        + '<td data-label="' + T('thTime') + '">' + esc(r.time) + '</td></tr>';
  });
  const who = (LANG === 'en' && s.eng) ? s.eng : s.chi;
  shell('<div class="bar"><div class="pill">' + T('myPoints') + '<em>' + s.points + '</em> ⭐</div>'
    + '<div class="nick">' + esc(s.cls) + ' (' + s.no + ') ' + esc(who) + '</div></div>'
    + (isPrev ? '<div class="hint" style="margin:6px 0 12px;background:#fff6d8;border:3px dashed #e0b060;border-radius:12px;padding:10px">👀 <b>預覽模式（唯讀）</b>——你正以老師身分查看 ' + esc(s.cls) + ' ' + s.no + ' 嘅學生版面。可切換語言睇英文版；學生資料唔會被你改動。<button class="btn btnS btn3" style="margin-left:8px" onclick="exitPreview()">返回管理台</button></div>' : '')
    + (s.frozen > 0 ? '<div class="hint" style="margin-bottom:10px">' + T('frozenNote') + s.frozen + ' ' + T('pts') + '　｜　' + T('avail') + '<b>' + avail + '</b> ' + T('pts') + '</div>' : '')
    + '<div class="tblwrap"><table class="rt"><thead><tr><th>' + T('thIcon') + '</th><th>' + T('thItem') + '</th><th>' + T('thCost') + '</th><th>' + T('thStock') + '</th><th>' + T('thLimit') + '</th><th>' + T('thRedeem') + '</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>'
    + (rh ? '<div class="sechd">' + T('myHistory') + '</div><div class="tblwrap"><table class="rt"><thead><tr><th style="text-align:left;padding-left:12px">' + T('thGift') + '</th><th>' + T('thPoints') + '</th><th>' + T('thState') + '</th><th>' + T('thTime') + '</th></tr></thead><tbody>' + rh + '</tbody></table></div>' : '')
    + '<div class="foot">' + (isPrev
        ? '<button class="btn btn2" onclick="exitPreview()">↩️ 返回管理台</button>'
        : '<button class="btn btn2" onclick="logout()">' + T('logout') + '</button>') + '</div>', true);
}
function previewStudent(){
  const cls = String(prompt('👀 預覽學生版面\n\n請輸入班別（例：5D）：', '') || '').trim().toUpperCase();
  if (!cls) return;
  const no = Number(prompt('請輸入班號（例：1）：', ''));
  if (!no) return;
  const st = (ADMIN.students || []).filter(s => String(s.cls).toUpperCase() === cls && Number(s.no) === no)[0];
  if (!st) { toast('找不到 ' + cls + ' 班 ' + no + ' 號', true); return; }
  const reqs = (ADMIN.requests || []).filter(r => String(r.cls).toUpperCase() === cls && Number(r.no) === no);
  PREVIEW = { reqs: reqs };
  ME = { student: st, available: (st.points || 0) - (st.frozen || 0), preview: true };
  GIFTS = ADMIN.gifts;
  renderStudent(reqs);
}
function exitPreview(){ PREVIEW = null; ME = null; boot(); }
async function redeem(row, name){
  let cost = 0;
  (GIFTS || []).forEach(g=>{ if (Number(g.row) === Number(row)) cost = g.cost; });
  const left = Math.max(0, (ME && ME.available ? ME.available : 0) - cost);
  ask(T('confirmRedeemFull', { gift: esc(name), cost: cost, left: left }), async function(){
    try { const r = await api('redeem', { giftRow: row }); toast(T('redeemSent', { n: r.available })); setTimeout(boot, 1200); }
    catch (e) { toast(e.message, true); }
  });
}
/* 學生自行取消申請（自動解凍）*/
function cancelAsk(gift){
  ask(T('confirmCancel', { gift: esc(gift) }), async function(){
    try { await api('cancel', {}); toast(T('cancelled')); setTimeout(boot, 900); }
    catch (e) { toast(e.message, true); }
  });
}
async function logout(){
  try { await api('logout', { token: IDT }); } catch (e) {}
  try { localStorage.removeItem('sess'); sessionStorage.removeItem('idtoken'); } catch (e) {}
  IDT = '';
  if (window.google) google.accounts.id.disableAutoSelect();
  renderLogin();
}

/* ================= 老師：管理台 ================= */
async function loadAdmin(){
  ADMIN = await api('admin.data');
  GIFTS = ADMIN.gifts;
  try { const t = localStorage.getItem('admTab'); if (t) TAB = t; } catch (e) {}
}
function renderAdmin(){
  const stu = ADMIN.students, reqs = ADMIN.requests, logs = ADMIN.logs;
  const pending = reqs.filter(r=>r.state === '待批核');
  const binds = stu.filter(s=>s.bindState === '已批准');
  const total = stu.reduce((a,s)=>a+(s.points||0),0);
  const st = '<div class="stat">'
    + '<div><b>' + stu.length + '</b><span>學生總數（4 組）</span></div>'
    + '<div><b>' + total + '</b><span>全級總積分</span></div>'
    + '<div><b>' + pending.length + '</b><span>待批核換領</span></div>'
    + '<div><b>' + binds.length + '</b><span>已綁定帳戶</span></div></div>';

  /* 按組別分頁 */
  const groups = [];
  stu.forEach(s=>{ if (groups.indexOf(s.group) < 0) groups.push(s.group); });
  const gTabs = groups.map(g=>{
    const n = stu.filter(s=>s.group === g).length;
    return tabBtn('g:' + g, '🏫 ' + groupLabel(g) + ' (' + n + ')');
  }).join('');

  let html = '<div class="bar"><div class="nick">👩‍🏫 ' + esc(ME ? ME.student ? ME.student.email : ME.email : '') + ' 老師</div>'
    + '<button class="btn btn2 btnS" onclick="logout()">登出</button></div>' + st
    + '<div class="tabs">'
    + tabBtn('students','📋 全部 (' + stu.length + ')') + gTabs + '</div>'
    + '<div class="tabs">'
    + tabBtn('pending','🎁 待批核 (' + (pending.length + binds.length) + ')')
    + tabBtn('gifts','🎀 禮物清單') + tabBtn('logs','📜 加分紀錄') + '</div>'
    + '<div style="margin:-2px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    +   '<button class="btn btn3 btnS" onclick="previewStudent()">👀 預覽學生版面</button>'
    +   '<a class="btn btnS onlypc" href="https://docs.google.com/spreadsheets/d/11H-Ncq-EXReVpLdDT8AXpCvCFFLyqzbK3SW6L26gHQw/edit" target="_blank" rel="noopener" style="text-decoration:none;background:#2f8f3f;color:#fff">📄 學生名單 (Sheet)</a>'
    +   ((TAB === 'students' || TAB.indexOf('g:') === 0)
          ? '<input class="inp sm" id="q" placeholder="🔍 搜尋姓名／班號" value="' + esc(SEARCH) + '" oninput="SEARCH=this.value;renderTab()" style="flex:1;min-width:160px">'
          : '')
    + '</div><div id="tabc"></div>'
    + '<div class="foot"><button class="btn btn3" onclick="exportXlsx()">📊 匯出 Excel</button><button class="btn btn2" onclick="backup()">匯出 CSV</button><button class="btn btn2" onclick="upgradeSheet()">🔧 升級表格</button><button class="btn" onclick="boot()">重新整理</button></div>';
  shell(html);
  renderTab();
}
function tabBtn(id, label){ return '<button class="tab' + (TAB===id?' on':'') + '" onclick="setTab(\'' + id + '\')">' + label + '</button>'; }
function setTab(id){ TAB = id; try { localStorage.setItem('admTab', id); } catch (e) {} renderAdmin(); }
function renderTab(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  const c = $('#tabc');
  if (TAB === 'students' || TAB.indexOf('g:') === 0) {
    const grp = TAB.indexOf('g:') === 0 ? TAB.slice(2) : '';
    const k = String(SEARCH || '').trim().toLowerCase();
    let list = grp ? ADMIN.students.filter(s=>s.group === grp) : ADMIN.students.slice();
    if (k) list = list.filter(s=>String(s.chi||'').toLowerCase().indexOf(k) >= 0
                              || String(s.eng||'').toLowerCase().indexOf(k) >= 0
                              || String(s.no) === k || (String(s.cls||'').toLowerCase() + String(s.no)) === k);
    let h = '<div class="sechd">' + (grp ? '🏫 ' + esc(groupLabel(grp)) : '📋 全部學生')
          + ' <span class="badge">' + list.length + ' 人</span>'
          + (k ? ' <span class="badge" style="background:#8a4a12">搜尋：' + esc(SEARCH) + '</span>' : '') + '</div>';
    if (!list.length) { c.innerHTML = h + '<div class="hint">沒有符合嘅學生</div>'; return; }
    h += '<div class="tblwrap"><table class="rt ct"><thead><tr>' + (grp ? '' : '<th>組別</th>')

    list.forEach(s=>{
      h += '<tr>' + (grp ? '' : '<td data-label="組別" style="font-size:12px">' + esc(s.group) + '</td>')
        + '<td data-label="班別" style="font-size:13px">' + esc(s.cls) + '</td>'
        + '<td data-label="班號" style="font-size:13px">' + s.no + '</td>'
        + '<td class="lead">' + esc(s.chi) + (Number(s.frozen) > 0 ? ' <span title="有待處理申請" style="font-size:13px">🔒</span>' : '') + '<div style="font-size:11px;color:#a3803f">' + esc(s.eng) + '</div></td>'
        + '<td class="cost" data-label="積分">' + s.points + '</td>'
        + '<td class="hide-s" data-label="狀態" style="font-size:13px">' + esc(s.status) + '</td>'
        + '<td class="hide-s" data-label="綁定" style="font-size:12px">' + (s.bindState ? esc(s.bindState) : '—')
        + (s.bindState === '已批准' ? ' <button class="btn btnS" style="background:#c0392b;padding:4px 8px;font-size:11px" onclick="unbindAsk(\'' + esc(s.cls) + '\',' + s.no + ')">' + T('unbind') + '</button>' : '') + '</td>'
        + '<td class="act"><button class="btn btnS" onclick="addPts(\'' + s.cls + '\',' + s.no + ',\'' + esc(s.chi) + '\')">+分</button></td></tr>';
    });
    c.innerHTML = h + '</tbody></table></div>';
  } else if (TAB === 'pending') {
    const rq = ADMIN.requests.filter(r=>r.state === '待批核');
    const bd = ADMIN.students.filter(s=>s.bindState === '待批核');
    let h = '<div class="sechd">🎁 換領申請 <span class="badge">' + rq.length + '</span></div>';
    h += rq.length ? rq.map(r=>'<div class="req"><div><div class="who">' + esc(r.cls) + ' ' + r.no + ' ' + esc(r.name) + '</div>'
      + '<div class="what">' + esc(r.time) + ' · 凍結 ' + r.cost + ' 分</div></div><div class="gift">' + esc(r.gift) + '</div>'
      + '<div><button class="btn btn3 btnS" onclick="decide(\'' + esc(r.cls) + '\',' + r.no + ',\'' + esc(r.gift) + '\',1)">批准</button> '
      + '<button class="btn btnS" style="background:#c0392b" onclick="decide(\'' + esc(r.cls) + '\',' + r.no + ',\'' + esc(r.gift) + '\',0)">拒絕</button></div></div>').join('')
      : '<div class="hint">暫無待批核申請</div>';
    h += '<div class="sechd">🔑 綁定申請 <span class="badge">' + bd.length + '</span></div>';
    h += bd.length ? '<div class="tblwrap"><table class="rt"><thead><tr><th>班別</th><th>班號</th><th>姓名</th><th>電郵</th><th>操作</th></tr></thead><tbody>'
      + bd.map(s=>'<tr><td data-label="班別">' + esc(s.cls) + '</td><td data-label="班號">' + s.no + '</td><td class="lead">' + esc(s.chi) + '</td>'

let GE = null, CROP = null;
function val(id){ const e = document.getElementById(id); return e ? e.value : ''; }
function editGift(row){

    + '<div class="fld"><label>Reward name (English)　英文名稱</label><input id="gNameEn" value="' + esc(GE.nameEn) + '"></div>'
    + '<div class="row2">'
    +   '<div class="fld"><label>所需積分</label><input id="gCost" type="number" value="' + GE.cost + '"></div>'
    +   '<div class="fld"><label>存貨（999 = 無限）</label><input id="gStock" type="number" value="' + GE.stock + '"></div>'
    + '</div><div class="row2">'

    +   '<div class="fld"><label>上限次數</label><input id="gLn" type="number" value="' + GE.limitN + '"></div>'
    + '</div>'
    + '<div class="fld"><label>上架</label><select id="gOn">' + opts(GE.on, ['是','否']) + '</select></div>'
    + '<div class="fld"><label>備註（中文）</label><input id="gNote" value="' + esc(GE.note) + '"></div>'
    + '<div class="fld"><label>Note (English)　英文備註</label><input id="gNoteEn" value="' + esc(GE.noteEn) + '"></div>'
    + '<div class="foot"><div><button class="btn btn3" onclick="saveGiftForm()">儲存</button> '
    + '<button class="btn" onclick="closeGift()">取消</button></div></div>'

function closeGift(){ const d = document.getElementById('gwrap'); if (d) d.remove(); GE = null; }
function clearImg(){ if (!GE) return; GE.img = ''; const p = document.getElementById('gPrev'); if (p) p.innerHTML = '未有圖片'; }
function pickImage(input){
  const f = input.files && input.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = function(e){
    const im = new Image();
    im.onload = function(){ CROP = { im: im, zoom: 1, x: 0, y: 0 }; openCrop(); };
    im.src = e.target.result;
  };
  fr.readAsDataURL(f);
  input.value = '';
}
function openCrop(){
  const d = document.createElement('div'); d.id = 'cwrap';
  d.innerHTML = '<div class="modal"><div class="mbox" style="max-width:400px">'
    + '<h3>✂️ 裁剪圖片</h3>'
    + '<div class="cropbox"><canvas id="ccv" width="200" height="200"></canvas></div>'
    + '<div class="fld"><label>縮放</label><input type="range" id="czoom" min="100" max="400" value="100"></div>'
    + '<div class="hint">用滑鼠／手指拖動圖片可移動位置，拉動拉桿可放大縮小。</div>'
    + '<div class="foot"><div><button class="btn btn3" onclick="applyCrop()">確定</button> '
    + '<button class="btn" onclick="closeCrop()">取消</button></div></div>'
    + '</div></div>';
  document.body.appendChild(d);
  const cv = document.getElementById('ccv');
  let drag = null;
  cv.addEventListener('pointerdown', function(e){ drag = { x: e.clientX, y: e.clientY, ox: CROP.x, oy: CROP.y }; try { cv.setPointerCapture(e.pointerId); } catch(err){} });
  cv.addEventListener('pointermove', function(e){ if (!drag) return; CROP.x = drag.ox + (e.clientX - drag.x); CROP.y = drag.oy + (e.clientY - drag.y); paintCrop(); });
  cv.addEventListener('pointerup', function(){ drag = null; });
  cv.addEventListener('pointercancel', function(){ drag = null; });
  document.getElementById('czoom').addEventListener('input', function(e){ CROP.zoom = Number(e.target.value) / 100; paintCrop(); });
  paintCrop();
}
function cropGeom(S){
  const im = CROP.im;
  const base = Math.max(S / im.width, S / im.height) * CROP.zoom;
  const w = im.width * base, h = im.height * base;
  let x = (S - w) / 2 + CROP.x, y = (S - h) / 2 + CROP.y;
  x = Math.min(0, Math.max(S - w, x));
  y = Math.min(0, Math.max(S - h, y));
  return { x: x, y: y, w: w, h: h };
}
function paintCrop(){
  const cv = document.getElementById('ccv'); if (!cv || !CROP) return;
  const S = 200; cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, S, S);
  const g = cropGeom(S);
  ctx.drawImage(CROP.im, g.x, g.y, g.w, g.h);
}
function applyCrop(){
  if (!CROP) return;
  const S = 160;
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, S, S);
  const g = cropGeom(S);
  ctx.drawImage(CROP.im, g.x, g.y, g.w, g.h);
  const data = cv.toDataURL('image/jpeg', 0.72);
  GE.img = data;
  const p = document.getElementById('gPrev'); if (p) p.innerHTML = '<img src="' + data + '">';
  closeCrop();
}

/* ================= XLSX 產生器（純前端、無外部依賴） =================
   產生真正的 .xlsx（Office Open XML）：多工作表、標題列顏色、欄寬、凍結首行、自動篩選。
   sheets = [{ name, cols:[widths], rows:[[...values]] }]，每張表第一列視為標題列。
*/
const _CRC_T = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function _crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = _CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function _u16(n) { return [n & 255, (n >> 8) & 255]; }
function _u32(n) { return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; }
function _zip(files) {                       // files: [[name, Uint8Array], ...]
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  files.forEach(function (f) {
    const nm = enc.encode(f[0]), d = f[1], crc = _crc32(d);
    const lh = new Uint8Array([].concat(_u32(0x04034b50), _u16(20), _u16(0x0800), _u16(0), _u16(0), _u16(0), _u32(crc), _u32(d.length), _u32(d.length), _u16(nm.length), _u16(0)));
    parts.push(lh, nm, d);
    cd.push(new Uint8Array([].concat(_u32(0x02014b50), _u16(20), _u16(20), _u16(0x0800), _u16(0), _u16(0), _u16(0), _u32(crc), _u32(d.length), _u32(d.length), _u16(nm.length), _u16(0), _u16(0), _u16(0), _u16(0), _u32(0), _u32(off))), nm);
    off += lh.length + nm.length + d.length;
  });
  let csz = 0; cd.forEach(function (x) { csz += x.length; });
  const eocd = new Uint8Array([].concat(_u32(0x06054b50), _u16(0), _u16(0), _u16(files.length), _u16(files.length), _u32(csz), _u32(off), _u16(0)));
  const all = parts.concat(cd, [eocd]);
  let total = 0; all.forEach(function (x) { total += x.length; });
  const out = new Uint8Array(total); let p = 0;
  all.forEach(function (x) { out.set(x, p); p += x.length; });
  return out;
}
function _colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function _xe(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]; }); }
function _enc(s) { return new TextEncoder().encode(s); }

const _STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  + '<fonts count="2">'
  + '<font><sz val="11"/><color rgb="FF2C3E50"/><name val="Calibri"/></font>'
  + '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>'
  + '</fonts>'
  + '<fills count="3">'
  + '<fill><patternFill patternType="none"/></fill>'
  + '<fill><patternFill patternType="gray125"/></fill>'
  + '<fill><patternFill patternType="solid"><fgColor rgb="FFC98B2E"/><bgColor indexed="64"/></patternFill></fill>'
  + '</fills>'
  + '<borders count="2">'
  + '<border><left/><right/><top/><bottom/><diagonal/></border>'
  + '<border><left style="thin"><color rgb="FFE0C89A"/></left><right style="thin"><color rgb="FFE0C89A"/></right><top style="thin"><color rgb="FFE0C89A"/></top><bottom style="thin"><color rgb="FFE0C89A"/></bottom><diagonal/></border>'
  + '</borders>'
  + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  + '<cellXfs count="3">'
  + '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>'
  + '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'
  + '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>'
  + '</cellXfs>'
  + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
  + '</styleSheet>';

function _sheetXml(sh) {
  const rows = sh.rows || [];
  const nCols = rows.length ? Math.max.apply(null, rows.map(function (r) { return r.length; })) : 0;
  const cols = (sh.cols || []).slice(0, nCols).map(function (w, i) {
    return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
  }).join('');
  let sd = '';
  rows.forEach(function (r, ri) {
    let cells = '';
    for (let ci = 0; ci < nCols; ci++) {
      const v = r[ci], ref = _colName(ci) + (ri + 1);
      if (typeof v === 'number' && isFinite(v)) cells += '<c r="' + ref + '" s="' + (ri === 0 ? 1 : 0) + '"><v>' + v + '</v></c>';
      else cells += '<c r="' + ref + '" s="' + (ri === 0 ? 1 : 2) + '" t="inlineStr"><is><t xml:space="preserve">' + _xe(v) + '</t></is></c>';
    }
    sd += '<row r="' + (ri + 1) + '"' + (ri === 0 ? ' ht="22" customHeight="1"' : '') + '>' + cells + '</row>';
  });
  const dim = nCols ? 'A1:' + _colName(nCols - 1) + Math.max(rows.length, 1) : 'A1';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<dimension ref="' + dim + '"/>'
    + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'
    + '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="16"/>'
    + (cols ? '<cols>' + cols + '</cols>' : '')
    + '<sheetData>' + sd + '</sheetData>'
    + (rows.length > 1 ? '<autoFilter ref="' + dim + '"/>' : '')
    + '</worksheet>';
}

function buildXlsx(sheets) {
  const files = [];
  const ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'];
  const wbSheets = [], wbRels = [];
  sheets.forEach(function (sh, i) {
    const n = i + 1;
    ct.push('<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    wbSheets.push('<sheet name="' + _xe(sh.name) + '" sheetId="' + n + '" r:id="rId' + n + '"/>');
    wbRels.push('<Relationship Id="rId' + n + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + n + '.xml"/>');
    files.push(['xl/worksheets/sheet' + n + '.xml', _enc(_sheetXml(sh))]);
  });
  ct.push('<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  wbRels.push('<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>');

  files.unshift(['[Content_Types].xml', _enc(ct.join(''))]);
  files.push(['_rels/.rels', _enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')]);
  files.push(['xl/workbook.xml', _enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<sheets>' + wbSheets.join('') + '</sheets></workbook>')]);
  files.push(['xl/_rels/workbook.xml.rels', _enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + wbRels.join('') + '</Relationships>')]);
  files.push(['xl/styles.xml', _enc(_STYLES)]);
  return _zip(files);
}

/* ================= 匯出 Excel (.xlsx) ================= */
function exportXlsx(){
  try {
    const s  = (ADMIN && ADMIN.students) || [], rq = (ADMIN && ADMIN.requests) || [];
    const gs = (ADMIN && ADMIN.gifts) || [],    lg = (ADMIN && ADMIN.logs) || [];
    const sheets = [
      { name:'學生總表', cols:[16,7,6,12,22,7,6,9,10,26],
        rows:[['組別','班別','班號','中文姓名','英文姓名','積分','凍結','狀態','綁定','電郵']]
          .concat(s.map(x=>[x.group,x.cls,x.no,x.chi,x.eng,x.points,x.frozen||0,x.status,x.bindState||'—',x.email||''])) },
      { name:'換領紀錄', cols:[18,7,6,12,18,7,9],
        rows:[['時間','班別','班號','姓名','禮物','分數','狀態']]
          .concat(rq.map(x=>[x.time,x.cls,x.no,x.name,x.gift,x.cost,x.state])) },
      { name:'禮物清單', cols:[8,22,7,8,10,10,7,22],
        rows:[['圖示','名稱','積分','存貨','上限類型','上限次數','上架','備註']]
          .concat(gs.map(x=>[x.icon,x.name,x.cost,(x.stock>=999?'無限':x.stock),x.limitType,x.limitN,(x.on==='是'||x.on===true)?'是':'否',x.note||''])) },
      { name:'加分紀錄', cols:[18,12,7,7,30],
        rows:[['時間','姓名','班別','分數','原因']]
          .concat(lg.map(x=>[x.time,x.name,x.cls,x.points,x.reason])) }
    ];
    const bytes = buildXlsx(sheets);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download = '數學科積分獎勵_' + new Date().toISOString().slice(0,10) + '.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('已匯出 Excel（' + s.length + ' 位學生、4 個工作表）');
  } catch (e) { toast('匯出失敗：' + e.message, true); }
}

function backup(){
  const rows = [['組別','班別','班號','英文姓名','中文姓名','積分','凍結','狀態','綁定電郵']];
  ADMIN.students.forEach(s=>rows.push([s.group,s.cls,s.no,s.eng,s.chi,s.points,s.frozen||0,s.status,s.email]));
  const csv = '\ufeff' + rows.map(r=>r.map(x=>'"' + String(x==null?'':x).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = 'reward_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
  toast('已匯出 CSV');
}
